<!DOCTYPE html>
<html>

<head>
    <title>Donation</title>
    <link rel="stylesheet" href="css/public_user.css">
</head>

<body>

    <div class="page-container">

        <header class="page-header">
            <h1>Animal Shelter Management System</h1>
            <h2>Make a Donation</h2>
        </header>

        <nav class="main-nav">
            <a href="available_animals.html">Available Animals</a>
            <a href="adoption_request.html">Adoption Request</a>
            <a href="donation.html" class="active">Donation</a>
        </nav>

        <main class="registration-container">

            <form id="donation-form">

                <fieldset class="form-section">

                    <legend>Donor Information</legend>

                    <div class="form-group">

                        <label for="donor_name">
                            Full Name:
                        </label>

                        <input
                            type="text"
                            id="donor_name"
                            name="full_name"
                            required>

                    </div>


                    <div class="form-group">

                        <label for="donor_email">
                            Email:
                        </label>

                        <input
                            type="email"
                            id="donor_email"
                            name="email"
                            required>

                    </div>


                    <div class="form-group">

                        <label for="donor_phone">
                            Phone Number:
                        </label>

                        <input
                            type="tel"
                            id="donor_phone"
                            name="phone"
                            required>

                    </div>

                </fieldset>


                <fieldset class="form-section">

                    <legend>Donation Information</legend>

                    <div class="form-group">

                        <label for="donation_type">
                            Donation Type:
                        </label>

                        <select
                            id="donation_type"
                            name="donation_type"
                            required>

                            <option value="">
                                Select Donation Type
                            </option>

                            <option value="Money">
                                Money
                            </option>

                            <option value="Food">
                                Food
                            </option>

                            <option value="Medicine">
                                Medicine
                            </option>

                            <option value="Animal Supplies">
                                Animal Supplies
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label for="amount_quantity">
                            Amount / Quantity:
                        </label>

                        <input
                            type="text"
                            id="amount_quantity"
                            name="amount_quantity"
                            required>

                    </div>


                    <div class="form-group">

                        <label>
                            Payment Method:
                        </label>

                        <div class="option-group">

                            <label>
                                <input
                                    type="radio"
                                    name="payment_method"
                                    value="Cash"
                                    required>
                                Cash
                            </label>

                            <label>
                                <input
                                    type="radio"
                                    name="payment_method"
                                    value="bKash">
                                bKash
                            </label>

                            <label>
                                <input
                                    type="radio"
                                    name="payment_method"
                                    value="Bank">
                                Bank
                            </label>

                        </div>

                    </div>


                    <div class="form-group">

                        <label for="description">
                            Description:
                        </label>

                        <textarea
                            id="description"
                            name="description"
                            rows="4"></textarea>

                    </div>

                </fieldset>


                <div class="form-buttons">

                    <input
                        type="submit"
                        value="Submit Donation"
                        class="btn primary-btn">

                    <input
                        type="reset"
                        value="Reset"
                        class="btn secondary-btn">

                </div>

            </form>

            <div class="back-link">
                <a href="available_animals.html">
                    Back to Available Animals
                </a>
            </div>

        </main>


        <footer class="page-footer">
            <p>Animal Shelter Management System</p>
        </footer>

    </div>

</body>

</html>
