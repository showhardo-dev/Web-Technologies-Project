<!DOCTYPE html>
<html>

<head>
    <title>Adoption Request</title>
    <link rel="stylesheet" href="css/public_user.css">
</head>

<body>

    <div class="page-container">

        <header class="page-header">
            <h1>Animal Shelter Management System</h1>
            <h2>Adoption Request</h2>
        </header>

        <nav class="main-nav">
            <a href="available_animals.html">Available Animals</a>
            <a href="adoption_request.html" class="active">Adoption Request</a>
            <a href="donation.html">Donation</a>
        </nav>


        <main class="registration-container">

            <form method="get"
                  action="adoption_submit.html"
                  onsubmit="return adoptionVal()"
                  novalidate>


                <fieldset class="form-section">

                    <legend>Animal Information</legend>


                    <div class="form-group">

                        <label for="animal_id">Animal ID:</label>

                        <input
                            type="text"
                            id="animal_id"
                            name="animal_id"
                            onkeyup="animalIdCheck()">

                        <p id="animaliderror" class="error-message"></p>

                    </div>


                    <div class="form-group">

                        <label for="animal_name">Animal Name:</label>

                        <input
                            type="text"
                            id="animal_name"
                            name="animal_name"
                            onkeyup="animalNameCheck()">

                        <p id="animalnameerror" class="error-message"></p>

                    </div>

                </fieldset>


                <fieldset class="form-section">

                    <legend>Applicant Information</legend>


                    <div class="form-group">

                        <label for="adopter_name">Full Name:</label>

                        <input
                            type="text"
                            id="adopter_name"
                            name="adopter_name"
                            onkeyup="adopterNameCheck()">

                        <p id="adopternameerror" class="error-message"></p>

                    </div>


                    <div class="form-group">

                        <label for="adopter_email">Email:</label>

                        <input
                            type="email"
                            id="adopter_email"
                            name="adopter_email"
                            onkeyup="adopterEmailCheck()">

                        <p id="adopteremailerror" class="error-message"></p>

                    </div>


                    <div class="form-group">

                        <label for="adopter_phone">Phone Number:</label>

                        <input
                            type="tel"
                            id="adopter_phone"
                            name="adopter_phone"
                            onkeyup="adopterPhoneCheck()">

                        <p id="adopterphoneerror" class="error-message"></p>

                    </div>


                    <div class="form-group">

                        <label for="adopter_address">Address:</label>

                        <textarea
                            id="adopter_address"
                            name="adopter_address"
                            rows="3"
                            onkeyup="addressCheck()"></textarea>

                        <p id="addresserror" class="error-message"></p>

                    </div>


                    <div class="form-group">

                        <label for="adoption_housing">
                            Housing Type:
                        </label>

                        <select
                            id="adoption_housing"
                            name="housing_type"
                            onchange="adoptionHousingCheck()">

                            <option value="">Select Housing Type</option>
                            <option value="House">House</option>
                            <option value="Apartment">Apartment</option>
                            <option value="Other">Other</option>

                        </select>

                        <p id="adoptionhousingerror" class="error-message"></p>

                    </div>


                    <div class="form-group">

                        <label>Previous Pet Experience:</label>

                        <div class="option-group">

                            <label>
                                <input
                                    type="radio"
                                    name="adoption_pet_experience"
                                    value="Yes"
                                    onchange="adoptionExperienceCheck()">
                                Yes
                            </label>

                            <label>
                                <input
                                    type="radio"
                                    name="adoption_pet_experience"
                                    value="No"
                                    onchange="adoptionExperienceCheck()">
                                No
                            </label>

                        </div>

                        <p id="adoptionexperienceerror"
                           class="error-message"></p>

                    </div>


                    <div class="form-group">

                        <label for="adoption_reason">
                            Reason for Adoption:
                        </label>

                        <textarea
                            id="adoption_reason"
                            name="adoption_reason"
                            rows="4"
                            onkeyup="adoptionReasonCheck()"></textarea>

                        <p id="adoptionreasonerror"
                           class="error-message"></p>

                    </div>

                </fieldset>


                <div class="form-buttons">

                    <input
                        type="submit"
                        value="Submit Adoption Request"
                        class="btn primary-btn">

                    <input
                        type="reset"
                        value="Reset"
                        class="btn secondary-btn">

                </div>

                <p id="adoptionSuccessMessage"></p>

            </form>


            <div class="back-link">
                <a href="available_animals.html">
                    Back to Available Animals
                </a>
            </div>

        </main>


        <footer class="page-footer">
            <p>Animal Shelter Management System</p>
        </footer>

    </div>


    <script src="js/public_user.js"></script>

</body>

</html>
