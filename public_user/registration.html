<!DOCTYPE html>
<html>

<head>
    <title>Public User Registration</title>
    <link rel="stylesheet" href="css/public_user.css">
</head>

<body>

    <div class="page-container">

        <header class="page-header">
            <h1>Animal Shelter Management System</h1>
            <h2>Public User Registration</h2>
        </header>

        <main class="registration-container">

            <form method="get"
                  action="submit.html"
                  onsubmit="return myVal()"
                  novalidate>

                <fieldset class="form-section">

                    <legend>Personal Information</legend>

                    <div class="form-group">
                        <label for="full_name">Full Name:</label>

                        <input
                            type="text"
                            id="full_name"
                            name="full_name"
                            onkeyup="nameCheck()">

                        <p id="nameerror" class="error-message"></p>
                    </div>


                    <div class="form-group">
                        <label for="email">Email:</label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            onkeyup="emailCheck()">

                        <p id="emailerror" class="error-message"></p>
                    </div>


                    <div class="form-group">
                        <label for="password">Password:</label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            onkeyup="passwordCheck()">

                        <p id="passworderror" class="error-message"></p>
                    </div>


                    <div class="form-group">
                        <label for="confirm_password">
                            Confirm Password:
                        </label>

                        <input
                            type="password"
                            id="confirm_password"
                            name="confirm_password"
                            onkeyup="confirmPasswordCheck()">

                        <p id="confirmerror" class="error-message"></p>
                    </div>


                    <div class="form-group">
                        <label for="phone">Phone Number:</label>

                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            onkeyup="phoneCheck()">

                        <p id="phoneerror" class="error-message"></p>
                    </div>


                    <div class="form-group">
                        <label for="address">Address:</label>

                        <textarea
                            id="address"
                            name="address"
                            rows="3"></textarea>
                    </div>

                </fieldset>


                <fieldset class="form-section">

                    <legend>Public User Information</legend>


                    <div class="form-group">
                        <label>User Type:</label>

                        <div class="option-group">

                            <label>
                                <input
                                    type="radio"
                                    name="user_type"
                                    value="Donor"
                                    onchange="userTypeCheck()">
                                Donor
                            </label>

                            <label>
                                <input
                                    type="radio"
                                    name="user_type"
                                    value="Adopter"
                                    onchange="userTypeCheck()">
                                Adopter
                            </label>

                            <label>
                                <input
                                    type="radio"
                                    name="user_type"
                                    value="Both"
                                    onchange="userTypeCheck()">
                                Both
                            </label>

                        </div>

                        <p id="usertypeerror" class="error-message"></p>
                    </div>


                    <div class="form-group">
                        <label for="preferred_animal">
                            Preferred Animal Type:
                        </label>

                        <select
                            id="preferred_animal"
                            name="preferred_animal"
                            onchange="animalCheck()">

                            <option value="">Select Animal Type</option>
                            <option value="Dog">Dog</option>
                            <option value="Cat">Cat</option>
                            <option value="Bird">Bird</option>
                            <option value="Other">Other</option>

                        </select>

                        <p id="animalerror" class="error-message"></p>
                    </div>


                    <div class="form-group">
                        <label>Previous Pet Experience:</label>

                        <div class="option-group">

                            <label>
                                <input
                                    type="radio"
                                    name="pet_experience"
                                    value="Yes"
                                    onchange="experienceCheck()">
                                Yes
                            </label>

                            <label>
                                <input
                                    type="radio"
                                    name="pet_experience"
                                    value="No"
                                    onchange="experienceCheck()">
                                No
                            </label>

                        </div>

                        <p id="experienceerror" class="error-message"></p>
                    </div>


                    <div class="form-group">
                        <label for="housing_type">
                            Housing Type:
                        </label>

                        <select
                            id="housing_type"
                            name="housing_type"
                            onchange="housingCheck()">

                            <option value="">Select Housing Type</option>
                            <option value="House">House</option>
                            <option value="Apartment">Apartment</option>
                            <option value="Other">Other</option>

                        </select>

                        <p id="housingerror" class="error-message"></p>
                    </div>


                    <div class="form-group">
                        <label>Donation Interest:</label>

                        <div class="option-group">

                            <label>
                                <input
                                    type="checkbox"
                                    id="donation_interest"
                                    name="donation_interest"
                                    onchange="donationCheck()">

                                Interested in Donation
                            </label>

                        </div>

                        <p id="donationerror" class="error-message"></p>
                    </div>

                </fieldset>


                <div class="form-buttons">

                    <input
                        type="submit"
                        value="Register"
                        class="btn primary-btn">

                    <input
                        type="reset"
                        value="Reset"
                        class="btn secondary-btn">

                </div>

                <p id="successMessage"></p>

            </form>

        </main>

        <footer class="page-footer">
            <p>Animal Shelter Management System</p>
        </footer>

    </div>

    <script src="js/public_user.js"></script>

</body>

</html>
