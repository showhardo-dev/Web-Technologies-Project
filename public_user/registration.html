<!DOCTYPE html>
<html>

<head>
    <title>Public User Registration</title>
    <link rel="stylesheet" href="css/public_user.css">
</head>

<body>

    <div class="page-container">

        <header class="page-header">
            <h1>Animal Shelter Management System</h1>
            <h2>Public User Registration</h2>
        </header>

        <main class="registration-container">

            <form id="registration-form">

                <fieldset class="form-section">

                    <legend>Personal Information</legend>

                    <div class="form-group">
                        <label for="full_name">Full Name:</label>

                        <input
                            type="text"
                            id="full_name"
                            name="full_name"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email:</label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="password">Password:</label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone Number:</label>

                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="address">Address:</label>

                        <textarea
                            id="address"
                            name="address"
                            rows="3"
                            required></textarea>
                    </div>

                </fieldset>


                <fieldset class="form-section">

                    <legend>Public User Information</legend>

                    <div class="form-group">

                        <label>User Type:</label>

                        <div class="option-group">

                            <label>
                                <input
                                    type="radio"
                                    name="user_type"
                                    value="Donor"
                                    required>
                                Donor
                            </label>

                            <label>
                                <input
                                    type="radio"
                                    name="user_type"
                                    value="Adopter">
                                Adopter
                            </label>

                            <label>
                                <input
                                    type="radio"
                                    name="user_type"
                                    value="Both">
                                Both
                            </label>

                        </div>

                    </div>


                    <div class="form-group">

                        <label for="preferred_animal">
                            Preferred Animal Type:
                        </label>

                        <select
                            id="preferred_animal"
                            name="preferred_animal"
                            required>

                            <option value="">
                                Select Animal Type
                            </option>

                            <option value="Dog">Dog</option>
                            <option value="Cat">Cat</option>
                            <option value="Bird">Bird</option>
                            <option value="Other">Other</option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label>Previous Pet Experience:</label>

                        <div class="option-group">

                            <label>
                                <input
                                    type="radio"
                                    name="pet_experience"
                                    value="Yes"
                                    required>
                                Yes
                            </label>

                            <label>
                                <input
                                    type="radio"
                                    name="pet_experience"
                                    value="No">
                                No
                            </label>

                        </div>

                    </div>


                    <div class="form-group">

                        <label for="housing_type">
                            Housing Type:
                        </label>

                        <select
                            id="housing_type"
                            name="housing_type"
                            required>

                            <option value="">
                                Select Housing Type
                            </option>

                            <option value="House">
                                House
                            </option>

                            <option value="Apartment">
                                Apartment
                            </option>

                            <option value="Other">
                                Other
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label>Donation Interest:</label>

                        <div class="option-group">

                            <label>
                                <input
                                    type="checkbox"
                                    name="donation_interest">

                                Interested in Donation
                            </label>

                        </div>

                    </div>

                </fieldset>


                <div class="form-buttons">

                    <input
                        type="submit"
                        value="Register"
                        class="btn primary-btn">

                    <input
                        type="reset"
                        value="Reset"
                        class="btn secondary-btn">

                </div>

            </form>

        </main>


        <footer class="page-footer">
            <p>Animal Shelter Management System</p>
        </footer>

    </div>

</body>

</html>
