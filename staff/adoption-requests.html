<!DOCTYPE html>
<html>
<head>
    <title>Adoption Request Management</title>
</head>

<body bgcolor="#F0F7F4">
<center>
<table width="85%" cellpadding="15" bgcolor="white" border="1">

    <tr>
        <td align="center" bgcolor="#245B4A">
            <h1><font color="white">Adoption Request Management</font></h1>
            <a href="dashboard.html"><font color="white">Staff Dashboard</font></a>
            &nbsp; | &nbsp;
            <a href="../commonui/index.html"><font color="white">Home</font></a>
        </td>
    </tr>

    <tr>
        <td align="center">
            <h2>Review Adoption Request</h2>
            <p>Enter request details and select its current status.</p>

            <form action="#" method="post">
                <table cellpadding="10" border="1">
                    <tr>
                        <td>Request ID:</td>
                        <td><input type="text" name="request_id" required></td>
                    </tr>

                    <tr>
                        <td>Adopter Name:</td>
                        <td><input type="text" name="adopter_name" required></td>
                    </tr>

                    <tr>
                        <td>Animal ID:</td>
                        <td><input type="text" name="animal_id" required></td>
                    </tr>

                    <tr>
                        <td>Request Date:</td>
                        <td><input type="date" name="request_date"></td>
                    </tr>

                    <tr>
                        <td>Request Status:</td>
                        <td>
                            <select name="request_status">
                                <option>Pending</option>
                                <option>Under Review</option>
                                <option>Accepted</option>
                                <option>Rejected</option>
                            </select>
                        </td>
                    </tr>

                    <tr>
                        <td colspan="2" align="center">
                            <input type="submit" value="Submit Request">
                            <input type="reset" value="Clear">
                        </td>
                    </tr>
                </table>
            </form>

            <p><a href="dashboard.html">Back to Dashboard</a></p>
        </td>
    </tr>

    <tr>
        <td align="center" bgcolor="#245B4A">
            <font color="white">Animal Shelter Management System</font>
        </td>
    </tr>

</table>
</center>
</body>
</html>
