<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Animal Care Records</title>
</head>
<body bgcolor="#f1f8e9" text="#222222">

    <h1 align="center"><font color="#1b5e20">Animal Care Management</font></h1>
    <h3 align="center"><font color="#2e7d32">Care Records and Behavior Logs</font></h3>

    <form>
       <center>
         <fieldset>
            <legend align="center"><font color="#1565c0">Animal Information</font></legend>
            <table bgcolor="#dcedc8">
                <tr>
                    <td><label><font color="#33691e">Animal ID:</font></label></td>
                    <td><input type="text" ></td>
                </tr>

                <tr>
                    <td><label ><font color="#33691e">Animal Name:</font></label></td>
                    <td><input type="text" ></td>
                </tr>

                <tr>
                    <td><label ><font color="#33691e">Animal Type:</font></label></td>
                    <td>
                        <select >
                            <option>Dog</option>
                            <option>Cat</option>
                            <option>Bird</option>
                            <option>Other</option>
                        </select>
                    </td>
                </tr>
            </table>
        </fieldset>
       </center>

        <br>

        <center>
            <fieldset>
            <legend align="center"><font color="#1565c0">Animal Care Record</font></legend>
            <table bgcolor="#dcedc8">
                <tr>
                    <td><label ><font color="#33691e">Care Date:</font></label></td>
                    <td><input type="date"></td>
                </tr>

                <tr>
                    <td><label for="food"><font color="#33691e">Food Provided:</font></label></td>
                    <td><input type="text"></td>
                </tr>

                <tr>
                    <td><label ><font color="#33691e">Health Condition:</font></label></td>
                    <td>
                        <select >
                            <option>Healthy</option>
                            <option>Sick</option>
                            <option>Injured</option>
                            <option>Under Treatment</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td><label ><font color="#33691e">Care Notes:</font></label></td>
                    <td><textarea ></textarea></td>
                </tr>
            </table>
        </fieldset>
        </center>

        <br>

        <center>
            <fieldset>
            <legend align="center"><font color="#1565c0">Temperament Log</font></legend>
            <table bgcolor="#dcedc8">
                <tr>
                    <td><label ><font color="#33691e">Animal Behavior:</font></label></td>
                    <td>
                        <select >
                            <option>Friendly</option>
                            <option>Calm</option>
                            <option>Playful</option>
                            <option>Fearful</option>
                            <option>Aggressive</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td><label><font color="#33691e">Behavior Details:</font></label></td>
                    <td><textarea></textarea></td>
                </tr>
            </table>
        </fieldset>

        </center>
        <br>

        <center><button type="submit">Save Care Record</button></center>
    </form>

</body>
</html>
