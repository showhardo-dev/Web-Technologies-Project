<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <h1 align="center">Volunteer Login</h1>
    <h3 align="center">Sign in to view your assigned tasks</h3>

    <form>
        <fieldset>
            <legend align="center">Account</legend>
           <center>
             <table>
                <tr>
                    <td><label for="loginid">Volunteer ID:</label></td>
                    <td><input type="text" id="loginid" name="loginid" required></td>
                </tr>

                <tr>
                    <td><label for="password">Password:</label></td>
                    <td><input type="password" id="password" name="password" required></td>
                </tr>

               
            </table>
           </center>
        </fieldset>

        <br>

        <center><button type="submit">Login</button></center>
    </form>

    <br>

    <p align="center">New here? <a href="volunteer_registration.html">Register as a volunteer</a></p>
        <script src="js/login.js"></script>

</body>
</html>
