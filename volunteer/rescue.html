<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rescue Operations</title>
</head>
<body bgcolor="#f1f8e9" text="#222222">

    <h1 align="center"><font color="#1b5e20">Rescue Dashboard</font></h1>
    <h3 align="center"><font color="#2e7d32">Rescue Requests and Schedules</font></h3>

    <form>
       <center>
         <fieldset>
            <legend align="center"><font color="#1565c0">Reporter Information</font></legend>
            <table bgcolor="#dcedc8">
                <tr>
                    <td><label><font color="#33691e">Reporter Name:</font></label></td>
                    <td><input type="text"></td>
                </tr>

                <tr>
                    <td><label for="id"><font color="#33691e">Reporter ID:</font></label></td>
                    <td><input type="text"></td>
                </tr>

                <tr>
                    <td><label for="phone"><font color="#33691e">Contact Number:</font></label></td>
                    <td><input type="tel"></td>
                </tr>
            </table>
        </fieldset>
       </center>

        <br>

        <center>
            <fieldset>
            <legend align="center"><font color="#1565c0">Rescue Details</font></legend>
            <table bgcolor="#dcedc8">
                <tr>
                    <td><label ><font color="#33691e">Rescue Type:</font></label></td>
                    <td><input type="text" ></td>
                </tr>

                <tr>
                    <td><label ><font color="#33691e">Location:</font></label></td>
                    <td><input type="text" ></td>
                </tr>

                <tr>
                    <td><label ><font color="#33691e">Rescue Date:</font></label></td>
                    <td><input type="date" ></td>
                </tr>

                <tr>
                    <td><label><font color="#33691e">Rescue Time:</font></label></td>
                    <td><input type="time" ></td>
                </tr>

                <tr>
                    <td><label ><font color="#33691e">Rescue Status:</font></label></td>
                    <td>
                        <select>
                            <option>Pending</option>
                            <option>In Progress</option>
                            <option>Completed</option>
                        </select>
                    </td>
                </tr>
            </table>
        </fieldset>
        </center>

        <br>

        <center><button type="submit">Save Rescue</button></center>
    </form>

</body>
</html>
