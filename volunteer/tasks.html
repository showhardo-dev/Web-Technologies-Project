<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Assigned Tasks</title>
</head>
<body bgcolor="#f1f8e9" text="#222222">

    <h1 align="center"><font color="#1b5e20">Volunteer Dashboard</font></h1>
    <h3 align="center"><font color="#2e7d32">Assigned Tasks and Schedules</font></h3>

    <form>
        <center>
            <fieldset>
            <legend align="center"><font color="#1565c0">Volunteer Information</font></legend>
            <table bgcolor="#dcedc8">
                <tr>
                    <td><label ><font color="#33691e">Volunteer Name:</font></label></td>
                    <td><input type="text" ></td>
                </tr>

                <tr>
                    <td><label ><font color="#33691e">Volunteer ID:</font></label></td>
                    <td><input type="text" ></td>
                </tr>
            </table>
        </fieldset>
        </center>

        <br>

        <center>
            <fieldset>
            <legend align="center"><font color="#1565c0">Assigned Task</font></legend>
            <table bgcolor="#dcedc8">
                <tr>
                    <td><label ><font color="#33691e">Task Name:</font></label></td>
                    <td><input type="text"></td>
                </tr>

                <tr>
                    <td><label ><font color="#33691e">Task Date:</font></label></td>
                    <td><input type="date" ></td>
                </tr>

                <tr>
                    <td><label><font color="#33691e">Task Time:</font></label></td>
                    <td><input type="time" ></td>
                </tr>

                <tr>
                    <td><label ><font color="#33691e">Task Status:</font></label></td>
                    <td>
                        <select >
                            <option>Pending</option>
                            <option>In Progress</option>
                            <option>Completed</option>
                        </select>
                    </td>
                </tr>
            </table>
        </fieldset>
        </center>

        <br>

        <center><button type="submit">Save Task</button></center>
    </form>

</body>
</html>
