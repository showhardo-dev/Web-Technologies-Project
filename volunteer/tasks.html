<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Assigned Tasks</title>
</head>
<body>

    <h1 align="center">Volunteer Dashboard</h1>
    <h3 align="center">Assigned Tasks and Schedules</h3>

    <form>
        <fieldset>
            <legend align="center">Volunteer Information</legend>
            <table>
                <tr>
                    <td><label >Volunteer Name:</label></td>
                    <td><input type="text" ></td>
                </tr>

                <tr>
                    <td><label >Volunteer ID:</label></td>
                    <td><input type="text" ></td>
                </tr>
            </table>
        </fieldset>

        <br>

        <fieldset>
            <legend align="center">Assigned Task</legend>
            <table>
                <tr>
                    <td><label >Task Name:</label></td>
                    <td><input type="text"></td>
                </tr>

                <tr>
                    <td><label >Task Date:</label></td>
                    <td><input type="date" ></td>
                </tr>

                <tr>
                    <td><label>Task Time:</label></td>
                    <td><input type="time" ></td>
                </tr>

                <tr>
                    <td><label >Task Status:</label></td>
                    <td>
                        <select >
                            <option>Pending</option>
                            <option>In Progress</option>
                            <option>Completed</option>
                        </select>
                    </td>
                </tr>
            </table>
        </fieldset>

        <br>

        <center><button type="submit">Save Task</button></center>
    </form>

</body>
</html>
