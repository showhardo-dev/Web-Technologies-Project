<!DOCTYPE html>
<html>

<head>
    <title>Adoption Request</title>
    <link rel="stylesheet" href="css/public_user.css">
</head>

<body>

    <div class="page-container">

        <header class="page-header">
            <h1>Animal Shelter Management System</h1>
            <h2>Adoption Request</h2>
        </header>

        <nav class="main-nav">
            <a href="available_animals.html">Available Animals</a>
            <a href="adoption_request.html" class="active">Adoption Request</a>
            <a href="donation.html">Donation</a>
        </nav>

        <main class="registration-container">

            <form id="adoption-form">

                <fieldset class="form-section">

                    <legend>Animal Information</legend>

                    <div class="form-group">
                        <label for="animal_id">Animal ID:</label>

                        <input
                            type="text"
                            id="animal_id"
                            name="animal_id"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="animal_name">Animal Name:</label>

                        <input
                            type="text"
                            id="animal_name"
                            name="animal_name"
                            required>
                    </div>

                </fieldset>


                <fieldset class="form-section">

                    <legend>Applicant Information</legend>

                    <div class="form-group">
                        <label for="adopter_name">Full Name:</label>

                        <input
                            type="text"
                            id="adopter_name"
                            name="full_name"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="adopter_email">Email:</label>

                        <input
                            type="email"
                            id="adopter_email"
                            name="email"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="adopter_phone">Phone Number:</label>

                        <input
                            type="tel"
                            id="adopter_phone"
                            name="phone"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="adopter_address">Address:</label>

                        <textarea
                            id="adopter_address"
                            name="address"
                            rows="3"
                            required></textarea>
                    </div>

                    <div class="form-group">

                        <label for="adoption_housing">
                            Housing Type:
                        </label>

                        <select
                            id="adoption_housing"
                            name="housing_type"
                            required>

                            <option value="">
                                Select Housing Type
                            </option>

                            <option value="House">
                                House
                            </option>

                            <option value="Apartment">
                                Apartment
                            </option>

                            <option value="Other">
                                Other
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label>Previous Pet Experience:</label>

                        <div class="option-group">

                            <label>
                                <input
                                    type="radio"
                                    name="pet_experience"
                                    value="Yes"
                                    required>
                                Yes
                            </label>

                            <label>
                                <input
                                    type="radio"
                                    name="pet_experience"
                                    value="No">
                                No
                            </label>

                        </div>

                    </div>


                    <div class="form-group">

                        <label for="adoption_reason">
                            Reason for Adoption:
                        </label>

                        <textarea
                            id="adoption_reason"
                            name="adoption_reason"
                            rows="4"
                            required></textarea>

                    </div>

                </fieldset>


                <div class="form-buttons">

                    <input
                        type="submit"
                        value="Submit Adoption Request"
                        class="btn primary-btn">

                    <input
                        type="reset"
                        value="Reset"
                        class="btn secondary-btn">

                </div>

            </form>

            <div class="back-link">
                <a href="available_animals.html">
                    Back to Available Animals
                </a>
            </div>

        </main>


        <footer class="page-footer">
            <p>Animal Shelter Management System</p>
        </footer>

    </div>

</body>

</html>
