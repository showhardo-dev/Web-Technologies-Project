<!DOCTYPE html>
<html>
<head>
    <title>Manage Animals</title>
</head>
<body>
 
    <h2 align="center">Animal Shelter Management System</h2>
    <h3 align="center">Admin - Manage Animal Records</h3>
 
    <a href="manage_user.html">Manage Users</a> |
    <a href="animal_records.html">Manage Animals</a> |
    <a href="view_reports.html">View Reports</a>
 
    <hr>
 
    <h3 align="center">Add New Animal</h3>
 
    <form>
        <fieldset>
            <legend>Animal Information</legend>
 
            Animal ID:
            <input type="text">
            <br><br>
 
            Animal Name:
            <input type="text">
            <br><br>
 
            Animal Type:
            <select>
                <option>Dog</option>
                <option>Cat</option>
                <option>Bird</option>
                <option>Other</option>
            </select>
            <br><br>
 
            Age:
            <input type="number">
            <br><br>
 
            Gender:
            <input type="radio" name="gender"> Male
            <input type="radio" name="gender"> Female
            <br><br>
 
            Rescue Date:
            <input type="date">
            <br><br>
 
            Health Status:
            <select>
                <option>Healthy</option>
                <option>Needs Care</option>
                <option>Under Treatment</option>
            </select>
            <br><br>
 
            Adoption Status:
            <select>
                <option>Available</option>
                <option>Adopted</option>
                <option>Not Available</option>
            </select>
            <br><br>
 
            Description:
            <textarea rows="3" cols="25"></textarea>
            <br><br>
 
            <input type="submit" value="Add Animal">
            <input type="reset" value="Clear">
 
        </fieldset>
    </form>
 
    <p align="center">
        <a href="index.html">Back to Dashboard</a>
    </p>
 
</body>
</html>
